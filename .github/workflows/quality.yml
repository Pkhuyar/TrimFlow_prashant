name: 10 code quality test

on:
  # Only enable manual trigger from main workflow; avoid standalone runs
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Run Linter (Flake8)
        run: |
          flake8 --select=F401,F841,E999,F821,F632,E722,E402 --max-line-length=100 . > flake8-report.txt
        continue-on-error: true

      - name: Upload Flake8 Report
        uses: actions/upload-artifact@v3
        with:
          name: flake8-report
          path: flake8-report.txt
