name: 20 - SAST Analysis for Python

on:
  workflow_call: # So this can be reused in main.yml

jobs:
  sast-python:
    name: Static Analysis - Python
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------
      # 1️⃣ OWASP Dependency-Check (still useful for transitive deps)
      # --------------------------------------
      - name: Setup Java for Dependency-Check
        uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: 11

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: "Python Project"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/

      # --------------------------------------
      # 2️⃣ Trivy Vulnerability Scanner
      # --------------------------------------
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          output: trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      # --------------------------------------
      # 3️⃣ Semgrep - Python rules
      # --------------------------------------
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Auto Python Rules)
        run: |
          semgrep --config auto --json > semgrep-report.json || true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      # --------------------------------------
      # 4️⃣ CodeQL (official GitHub scanner)
      # --------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
